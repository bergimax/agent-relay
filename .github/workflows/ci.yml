name: CI

on:
  push:
  workflow_dispatch:

env:
  KIND_CLUSTER: agent-relay
  IMAGE_NAME: agent-relay

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_relay
          POSTGRES_PASSWORD: agent_relay
          POSTGRES_DB: agent_relay
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent_relay -d agent_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --locked

      - name: Run starter test suite (SQLite)
        run: uv run pytest -v test_agent_relay.py

      - name: Start the API against PostgreSQL
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@localhost:5433/agent_relay
        run: |
          uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo $! > uvicorn.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "server never became healthy" >&2
          exit 1

      - name: Run integration test against the live PostgreSQL-backed API
        env:
          RELAY_TEST_BASE_URL: http://127.0.0.1:8000
          RELAY_TEST_DB_URL: postgresql+psycopg://agent_relay:agent_relay@localhost:5433/agent_relay
        run: uv run pytest -v test_integration_live.py

      - name: Stop the API
        if: always()
        run: kill "$(cat uvicorn.pid)" 2>/dev/null || true

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute a unique image tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Install kubectl and kind
        run: |
          curl -sSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          curl -sSL -o /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64"
          chmod +x /usr/local/bin/kind

      - name: Point kubectl at the kind cluster
        run: kind export kubeconfig --name "${KIND_CLUSTER}"

      - name: Build the Docker image
        run: docker build -t "${IMAGE_NAME}:${{ steps.tag.outputs.tag }}" .

      - name: Load the image into kind
        run: kind load docker-image "${IMAGE_NAME}:${{ steps.tag.outputs.tag }}" --name "${KIND_CLUSTER}"

      - name: Deploy the new image and wait for rollout
        run: |
          kubectl set image deployment/agent-relay "agent-relay=${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"
          kubectl rollout status deployment/agent-relay --timeout=120s
